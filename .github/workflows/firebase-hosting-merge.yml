name: Verify main and manually deploy Firebase Hosting
on:
  workflow_dispatch:
    inputs:
      deploy_live:
        description: Deploy this app to live Firebase Hosting
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      VITE_SALESAPP_FIREBASE_CONFIG: ${{ secrets.VITE_SALESAPP_FIREBASE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CISAPP_236AB }}
          channelId: live
          projectId: cisapp-236ab
