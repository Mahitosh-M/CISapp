name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
      - run: npm --prefix functions ci && npm --prefix functions test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CISAPP_236AB }}
      - run: npx --yes firebase-tools@latest deploy --only hosting,functions,firestore:rules,firestore:indexes --project cisapp-236ab --non-interactive
